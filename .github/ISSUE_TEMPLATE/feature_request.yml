name: Feature request
description: Suggest an enhancement for aiomarstek
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Describe the feature you would like to see.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the change you would like to see.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any alternative approaches you have considered.
