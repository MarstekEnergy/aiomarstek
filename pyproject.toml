[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiomarstek"
version = "0.1.3"
description = "Async client library for local Marstek devices"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Marstek" }]
keywords = ["asyncio", "home-assistant", "marstek", "udp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/MarstekEnergy/aiomarstek"
Issues = "https://github.com/MarstekEnergy/aiomarstek/issues"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["aiomarstek"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
# Line length is enforced by the formatter; E501 would only flag
# unbreakable string literals (log messages, f-strings).
ignore = ["E501"]
