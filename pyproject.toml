[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiomarstek"
version = "0.1.1"
description = "Async client library for local Marstek devices"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Marstek" }]
keywords = ["asyncio", "home-assistant", "marstek", "udp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/MarstekEnergy/aiomarstek"
Issues = "https://github.com/MarstekEnergy/aiomarstek/issues"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["aiomarstek"]
